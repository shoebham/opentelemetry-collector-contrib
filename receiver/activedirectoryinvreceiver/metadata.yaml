type: active_directory_inv

status:
  class: receiver
  stability:
    alpha: [logs]
  distributions: [contrib]
  codeowners:
    active: [pjanotti,pankaj101A, jagan2221]

tests:
  skip_lifecycle: true
  skip_shutdown: true
  # go-adsi/comshim keeps a COM apartment goroutine for process lifetime.
  goleak:
    ignore:
      any:
        - "github.com/scjalliance/comshim.(*Shim).run.func1"