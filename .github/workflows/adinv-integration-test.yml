# Integration tests for receiver/activedirectoryinvreceiver against a real
# Windows Active Directory Domain Services forest (full AD DS, not AD LDS).
#
# Hosted runners cannot reboot mid-job, so after Install-ADDSForest we mount
# the promoted ntds.dit with dsamain.exe (AD DS tool) on localhost:389 and
# point ADSI via AD_LDAP_SERVER=127.0.0.1.
name: adinv-integration-test

on:
  push:
    branches:
      - main
      - feat/adinv-integration-test
      - "**/adinv*"
    paths:
      - "receiver/activedirectoryinvreceiver/**"
      - ".github/workflows/adinv-integration-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adinv-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  AD_DOMAIN_NAME: oteltest.local
  AD_NETBIOS_NAME: OTELTEST
  AD_SAFE_MODE_PASSWORD: "P@ssw0rd123!SafeMode"
  AD_TEST_USER_PASSWORD: "P@ssw0rd123!User"
  AD_BASE_DN: "CN=Users,DC=oteltest,DC=local"
  # Default; setup-ad-ds.ps1 overwrites via GITHUB_ENV when dsamain uses 10389.
  AD_LDAP_SERVER: "127.0.0.1:10389"
  AD_SEEDED_USERS: "false"

jobs:
  adinv-integration:
    name: AD DS inventory integration
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: oldstable
          cache-dependency-path: receiver/activedirectoryinvreceiver/go.sum

      # Setup prints progress; verify+go test are inlined at the end of this step so we never
      # appear "stuck" with no output between workflow steps after marker file is written.
      - name: Install AD DS, verify LDAP, run integration tests
        id: setup_ad
        timeout-minutes: 55
        shell: powershell
        env:
          AD_BASE_DN: ${{ env.AD_BASE_DN }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "==== STEP 1/3: setup-ad-ds.ps1 ===="
          $script = Join-Path $env:GITHUB_WORKSPACE "receiver\activedirectoryinvreceiver\testdata\integration\setup-ad-ds.ps1"
          & $script
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "==== setup log tail ===="
            if (Test-Path C:\otel-ad-ds-setup.log) { Get-Content C:\otel-ad-ds-setup.log -Tail 100 }
            exit $code
          }
          Write-Host "setup exit=0 AD_LDAP_SERVER=$env:AD_LDAP_SERVER AD_SEEDED_USERS=$env:AD_SEEDED_USERS"
          if (-not $env:AD_LDAP_SERVER) { $env:AD_LDAP_SERVER = "127.0.0.1:10389" }
          if (-not $env:AD_BASE_DN) { $env:AD_BASE_DN = "CN=Users,DC=oteltest,DC=local" }
          if (-not $env:AD_SEEDED_USERS) { $env:AD_SEEDED_USERS = "false" }

          Write-Host "==== STEP 2/3: verify LDAP/ADSI (quick, no hang) ===="
          $server = $env:AD_LDAP_SERVER
          $ldapHost = "127.0.0.1"
          $ldapPort = 10389
          if ($server -match '^([^:]+):(\d+)$') {
            $ldapHost = $Matches[1]
            $ldapPort = [int]$Matches[2]
          } elseif ($server) {
            $ldapHost = $server
          }
          Write-Host "server=$server ldapHost=$ldapHost ldapPort=$ldapPort"
          $tcp = New-Object System.Net.Sockets.TcpClient
          $iar = $tcp.BeginConnect($ldapHost, $ldapPort, $null, $null)
          if (-not $iar.AsyncWaitHandle.WaitOne(5000, $false)) {
            $tcp.Close()
            throw "TCP ${ldapHost}:${ldapPort} not open within 5s"
          }
          try { $tcp.EndConnect($iar) } catch { $tcp.Close(); throw "TCP connect failed: $_" }
          $tcp.Close()
          Write-Host "TCP ok"
          try {
            $root = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/RootDSE")
            $nc = $root.Properties["defaultNamingContext"].Value
            Write-Host "defaultNamingContext=$nc"
            if (-not $nc) { throw "empty defaultNamingContext" }
            $users = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/CN=Users,$nc")
            Write-Host "CN=Users path=$($users.Path)"
          } catch {
            Write-Host "ADSI verify failed: $_"
            throw $_
          }
          Write-Host "LDAP/ADSI verify ok"

          Write-Host "==== STEP 3/3: go test -tags=integration ===="
          Write-Host "AD_LDAP_SERVER=$env:AD_LDAP_SERVER AD_BASE_DN=$env:AD_BASE_DN AD_SEEDED_USERS=$env:AD_SEEDED_USERS"
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "receiver\activedirectoryinvreceiver")
          try {
            go test -tags=integration -timeout 10m -count=1 -v ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          Write-Host "==== ALL STEPS COMPLETE ===="
          exit 0

      # Keep this step fast: Test-NetConnection / Get-WinEvent / ADSI hang on failed runners.
      - name: Dump AD / system diagnostics on failure
        if: failure()
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "==== Services ===="
          try {
            Get-Service NTDS, ADWS, DNS, Netlogon, Kdc -ErrorAction SilentlyContinue |
              Format-Table Name, Status, StartType -AutoSize | Out-String | Write-Host
          } catch { Write-Host "services: $_" }

          Write-Host "==== dsamain process ===="
          try {
            Get-Process dsamain -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
          } catch { Write-Host "dsamain: $_" }

          Write-Host "==== Marker / phase / log files ===="
          foreach ($f in @("C:\otel-ad-ds-ready.marker", "C:\otel-ad-phase1.marker", "C:\otel-ad-ds-setup.log", "C:\otel-dsamain.pid")) {
            Write-Host "--- $f ---"
            if (Test-Path $f) {
              Get-Content $f -Tail 60 -ErrorAction SilentlyContinue
            } else {
              Write-Host "(missing)"
            }
          }

          Write-Host "==== ntds.dit ===="
          try {
            if (Test-Path C:\Windows\NTDS\ntds.dit) {
              Get-Item C:\Windows\NTDS\ntds.dit | Format-List FullName, Length, LastWriteTime | Out-String | Write-Host
            } else {
              Write-Host "(missing)"
            }
          } catch { Write-Host "ntds.dit: $_" }

          Write-Host "==== TCP 389 quick probe ===="
          try {
            $tcp = New-Object System.Net.Sockets.TcpClient
            $iar = $tcp.BeginConnect("127.0.0.1", 389, $null, $null)
            $ok = $iar.AsyncWaitHandle.WaitOne(2000, $false)
            if ($ok) { $tcp.EndConnect($iar); Write-Host "port 389 OPEN" } else { Write-Host "port 389 CLOSED/timeout" }
            $tcp.Close()
          } catch { Write-Host "tcp probe: $_" }

          Write-Host "==== diagnostics done ===="
          exit 0
