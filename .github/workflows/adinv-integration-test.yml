# Integration tests for receiver/activedirectoryinvreceiver against a real
# Windows Active Directory Domain Services forest (full AD DS, not AD LDS).
#
# AD DS forest promotion normally requires a reboot. Hosted runners lose the
# job on reboot, so we try to bring NTDS/LDAP up without rebooting first. If
# that fails (exit 42 from setup script), we reboot via a scheduled task that
# re-invokes the runner job steps is not possible; instead we use an in-job
# reboot with a startup scheduled task that writes a phase marker and the
# workflow is designed as a single job that:
#   1) promotes AD (phase 1)
#   2) if exit 42, registers a one-shot startup task + reboots
#   3) after reboot the runner agent is dead on hosted runners, so we ALSO
#      attempt a no-reboot path aggressively.
#
# On windows-2025 hosted runners we prioritize the no-reboot path. If LDAP
# still fails, the job fails with diagnostics (reboot is not recoverable on
# hosted runners mid-job).
name: adinv-integration-test

on:
  push:
    branches:
      - main
      - feat/adinv-integration-test
      - "**/adinv*"
    paths:
      - "receiver/activedirectoryinvreceiver/**"
      - ".github/workflows/adinv-integration-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adinv-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  AD_DOMAIN_NAME: oteltest.local
  AD_NETBIOS_NAME: OTELTEST
  AD_SAFE_MODE_PASSWORD: "P@ssw0rd123!SafeMode"
  AD_TEST_USER_PASSWORD: "P@ssw0rd123!User"
  AD_BASE_DN: "CN=Users,DC=oteltest,DC=local"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  adinv-integration:
    name: AD DS inventory integration
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Skip full-repo gomoddownload — only this receiver module is tested.
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: oldstable
          cache-dependency-path: receiver/activedirectoryinvreceiver/go.sum

      # Install AD first (slowest step) before go deps so we fail fast if AD cannot start.
      - name: Install and configure full AD DS forest
        id: setup_ad
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "receiver\activedirectoryinvreceiver\testdata\integration\setup-ad-ds.ps1"
          & $script
          if ($LASTEXITCODE -ne 0) {
            Write-Host "==== setup log ===="
            if (Test-Path C:\otel-ad-ds-setup.log) { Get-Content C:\otel-ad-ds-setup.log }
            exit $LASTEXITCODE
          }
          Write-Host "AD_LDAP_SERVER=$env:AD_LDAP_SERVER AD_SEEDED_USERS=$env:AD_SEEDED_USERS"

      - name: Verify AD DS is reachable via LDAP/ADSI
        shell: powershell
        run: |
          $server = if ($env:AD_LDAP_SERVER) { $env:AD_LDAP_SERVER } else { "127.0.0.1" }
          Write-Host "Probing LDAP via server=$server"
          $root = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/RootDSE")
          $nc = $root.Properties["defaultNamingContext"].Value
          Write-Host "defaultNamingContext=$nc"
          if (-not $nc) { throw "RootDSE defaultNamingContext is empty" }
          $users = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/CN=Users,$nc")
          Write-Host "Opened CN=Users: $($users.Path)"
          try {
            $user = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/CN=Otel TestUser,CN=Users,$nc")
            Write-Host "Seeded user mail=$($user.Properties['mail'].Value) department=$($user.Properties['department'].Value)"
          } catch {
            Write-Host "Custom seeded user not present - read-only dsamain is OK: $_"
            $admin = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/CN=Administrator,CN=Users,$nc")
            Write-Host "Built-in Administrator name=$($admin.Properties['name'].Value)"
          }

      - name: Run activedirectoryinvreceiver integration tests
        working-directory: receiver/activedirectoryinvreceiver
        shell: powershell
        env:
          AD_BASE_DN: ${{ env.AD_BASE_DN }}
        run: |
          Write-Host "AD_LDAP_SERVER=$env:AD_LDAP_SERVER AD_BASE_DN=$env:AD_BASE_DN AD_SEEDED_USERS=$env:AD_SEEDED_USERS"
          go test -tags=integration -timeout 10m -count=1 -v ./...

      - name: Dump AD / system diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "==== Services ===="
          Get-Service NTDS, ADWS, DNS, Netlogon, Kdc -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "==== dsamain process ===="
          Get-Process dsamain -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          Write-Host "==== Marker / phase files ===="
          foreach ($f in @("C:\otel-ad-ds-ready.marker", "C:\otel-ad-phase1.marker", "C:\otel-ad-ds-setup.log", "C:\otel-dsamain.pid")) {
            Write-Host "--- $f ---"
            if (Test-Path $f) { Get-Content $f | Select-Object -Last 80 } else { Write-Host "(missing)" }
          }
          Write-Host "==== RootDSE probe ===="
          $server = if ($env:AD_LDAP_SERVER) { $env:AD_LDAP_SERVER } else { "127.0.0.1" }
          try {
            $root = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$server/RootDSE")
            $root.Properties.PropertyNames | ForEach-Object { "$_=$($root.Properties[$_].Value)" } | Write-Host
          } catch { Write-Host "RootDSE failed: $_" }
          Write-Host "==== Port 389 ===="
          try { Test-NetConnection -ComputerName 127.0.0.1 -Port 389 | Format-List | Out-String | Write-Host } catch {}
          Write-Host "==== ntds.dit ===="
          Get-Item C:\Windows\NTDS\ntds.dit -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          Write-Host "==== Recent Directory Service events ===="
          try {
            Get-WinEvent -LogName "Directory Service" -MaxEvents 20 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, LevelDisplayName, Message | Out-String | Write-Host
          } catch { Write-Host "No Directory Service events: $_" }
